<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'none'; frame-src 'none'; base-uri 'none'"><link rel="stylesheet" href="leaflet.css"><style>html,body,#map{height:100%;margin:0;background:#e9eef6;font:13px sans-serif}#cross{position:absolute;top:50%;left:50%;z-index:600;pointer-events:none;transform:translate(-50%,-50%);color:#3478e5;font-size:32px;text-shadow:0 1px white}#hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:600;background:white;padding:7px 12px;border-radius:20px;white-space:nowrap;box-shadow:0 2px 8px #0001}.leaflet-control-attribution{font-size:10px!important}.leaflet-control-zoom a{color:#3478e5!important}</style></head><body><div id="map"></div><div id="cross">＋</div><div id="hint">WGS-84 · 拖动或点击选点</div><script src="leaflet.js"></script><script>
'use strict';let map,selected,actual,route,animation,line,startPoint,endPoint,progress=0,timer=null,routeState='stopped',programmatic=false,tileSuccess=0,tileErrorReported=false;
const hint=s=>document.getElementById('hint').textContent=s;
function send(lat,lon,label){if(Number.isFinite(lat)&&Number.isFinite(lon)&&Math.abs(lat)<=90&&Math.abs(lon)<=180)MapBridge.selected(lat,lon,label||'地图选点');}
function pick(lat,lon,label,pan){if(!map)return;selected.setLatLng([lat,lon]);if(pan){programmatic=true;map.setView([Math.max(-85,Math.min(85,lat)),lon],Math.max(14,map.getZoom()),{animate:false});programmatic=false;}hint('WGS-84 · 蓝点为选中位置');}
function actualFix(lat,lon,mock){if(actual)map.removeLayer(actual);actual=L.circleMarker([lat,lon],{radius:8,color:mock?'#c38726':'#22a06b',fillColor:mock?'#c38726':'#22a06b',fillOpacity:.8}).addTo(map);actual.bindTooltip(mock?'系统位置（Mock）':'设备系统位置');}
function setStart(lat,lon){startPoint=[lat,lon];hint('已设路线起点 · 再选择终点');}
function stopPreview(){if(timer)clearInterval(timer);timer=null;routeState='stopped';progress=0;if(animation){map.removeLayer(animation);animation=null;}if(line){map.removeLayer(line);line=null;}hint('本地路线已停止 · 不改变系统定位');MapBridge.previewState(routeState);}
function preview(action,lat,lon){if(!map)return;if(action==='stop'){stopPreview();return;}if(action==='pause'){if(!timer||!animation)return;if(timer)clearInterval(timer);timer=null;routeState='paused';MapBridge.previewState(routeState);hint('路线预览已暂停 · 仅本地');return;}if(action==='start'){if(!startPoint){hint('请先设置路线起点');return;}stopPreview();endPoint=[lat,lon];progress=0;line=L.polyline([startPoint,endPoint],{color:'#c38726',dashArray:'6,6'}).addTo(map);animation=L.circleMarker(startPoint,{radius:9,color:'#c38726',fillOpacity:1}).addTo(map);}if(!animation||!endPoint)return;if(timer)clearInterval(timer);routeState='running';MapBridge.previewState(routeState);hint('橙点：本地路线预览 · 不发布系统位置');timer=setInterval(()=>{progress=Math.min(1,progress+1/300);let dl=endPoint[1]-startPoint[1];if(dl>180)dl-=360;if(dl<-180)dl+=360;let lon=((startPoint[1]+dl*progress+540)%360)-180;animation.setLatLng([startPoint[0]+(endPoint[0]-startPoint[0])*progress,lon]);if(progress>=1){clearInterval(timer);timer=null;routeState='completed';MapBridge.previewState(routeState);hint('路线预览完成 · 仅本地');}},100);}
try{map=L.map('map',{zoomControl:false}).setView([35,105],4);L.control.zoom({position:'bottomright'}).addTo(map);const tiles=L.tileLayer(__TILE_TEMPLATE__,{maxZoom:19,attribution:__TILE_ATTRIBUTION__,keepBuffer:0,updateWhenIdle:true,updateWhenZooming:false}).addTo(map);tiles.on('tileload',()=>{tileSuccess++;MapBridge.tilesReady();});tiles.on('tileerror',()=>{if(!tileSuccess&&!tileErrorReported){tileErrorReported=true;hint('底图暂不可用 · 仍可输入坐标');MapBridge.mapError('地图底图加载失败，可手动输入坐标');}});selected=L.circleMarker([35,105],{radius:8,color:'#3478e5',fillColor:'#3478e5',fillOpacity:1}).addTo(map);map.on('zoomend',()=>hint('WGS-84 · 缩放 '+map.getZoom()));map.on('click',e=>{pick(e.latlng.lat,e.latlng.lng,'地图选点',true);send(e.latlng.lat,e.latlng.lng,'地图选点');});map.on('moveend',()=>{if(programmatic)return;const p=map.getCenter();pick(p.lat,p.lng,'地图中心',false);send(p.lat,p.lng,'地图中心');});MapBridge.ready();}catch(e){hint('地图资源未就绪 · 请使用手动坐标');MapBridge.mapError('地图资源未就绪');}
</script></body></html>
